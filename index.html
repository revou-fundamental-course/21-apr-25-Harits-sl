<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Temperature Converter</title>
  </head>
  <body>
    <header>
      <nav></nav>
    </header>
    <main>
      <section>
        <p>
          Masukan suhu derajat Celcius (&deg;C) ke kotak dibawah, lalu klik tombol Konversi untuk mendapatkan hasil
          konversi dalam bentuk Fahrenheit(&deg;F).
        </p>
      </section>

      <!-- input celcius or Fahrenheit -->
      <section>
        <p>Celcius (&deg;C):</p>
        <textarea
          name=""
          id=""
          required
        ></textarea>
      </section>

      <!-- Button -->
      <section>
        <button>Konversi</button>
        <button>Reset</button>
        <button>Reverse</button>
      </section>

      <!-- Hasil dari konversi celcius atau fahrenheit -->
      <section>
        <p>Fahrenheit (&deg;F):</p>
        <textarea
          name=""
          id=""
          readonly
        ></textarea>
      </section>

      <!-- Cara Kalkukasi celcius ke fahrenheit atau sebaliknya-->
      <section>
        <p>Cara Kalkulasi:</p>
        <textarea
          name=""
          id=""
          readonly
        ></textarea>
      </section>
    </main>
  </body>
</html>
